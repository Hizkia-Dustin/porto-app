name: Validate skill

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: ./scripts/validate.sh
      - name: Rebuild skill package
        run: ./scripts/build-skill.sh
      - name: Check package is current
        run: git diff --exit-code -- dist/design-slop.skill
