name: Bug report
description: Installing, a script or the skill's output did something wrong.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install (npx skills add or the Claude Code plugin)
        - Helper script (audit, shoot, og, font, photos, serve)
        - /awwwards output (the site the agent built)
        - /jury output (the score card)
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked for, what you expected, and what you got instead.
      placeholder: |
        Prompt: "make me a portfolio, my name is Ana"
        Expected: ...
        Got: ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx skills add juliobsz/skills -g
        2. ...
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code + Opus, Codex CLI + ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 15, Node 22.11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or a link to the built site
      render: text
