name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays: rebuild the fixtures against the latest releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    if: github.event_name != 'schedule' # the weekly run only rebuilds the fixtures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check scripts
        shell: bash
        run: for f in */scripts/*.mjs; do node --check "$f" && echo "ok $f"; done

      - name: Audit reads minified HTML
        run: node tests/audit/check.mjs

      - name: Validate SKILL.md frontmatter
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync(".", { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync(`${d.name}/SKILL.md`)).map((d) => d.name);
            if (!dirs.length) throw new Error("no skills found");
            for (const d of dirs) {
              const fm = fs.readFileSync(`${d}/SKILL.md`, "utf8").match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!fm) throw new Error(`${d}: missing frontmatter`);
              const name = fm[1].match(/^name:\s*(.+)$/m)?.[1].trim();
              const desc = fm[1].match(/^description:\s*(.+)$/m)?.[1].trim();
              if (name !== d) throw new Error(`${d}: name "${name}" must match folder`);
              if (!desc || desc.length > 1024) throw new Error(`${d}: description missing or over 1024 chars`);
              console.log(`ok ${d}`);
            }'

      - name: Validate plugin marketplace
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            if (!m.name || !m.owner?.name || !m.plugins?.length) throw new Error("marketplace needs name, owner and plugins");
            for (const p of m.plugins) {
              if (!p.source.startsWith("./")) throw new Error(`${p.name}: source must start with ./`);
              if (!fs.existsSync(`${p.source}/SKILL.md`)) throw new Error(`${p.name}: no SKILL.md at ${p.source}`);
              console.log(`ok ${p.name}`);
            }
            const listed = new Set(m.plugins.map((p) => p.source.replace(/^\.\//, "").replace(/\/$/, "")));
            for (const d of fs.readdirSync(".", { withFileTypes: true })) {
              if (d.isDirectory() && fs.existsSync(`${d.name}/SKILL.md`) && !listed.has(d.name))
                throw new Error(`${d.name}: skill folder has no plugin entry in marketplace.json`);
            }'

      - name: skills CLI finds every skill
        if: matrix.node == 22 # the skills CLI needs Node 22.20+
        shell: bash
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          out=$(npx -y skills@latest add . --list 2>&1)
          echo "$out"
          for d in */; do
            d=${d%/}
            [ -f "$d/SKILL.md" ] || continue
            echo "$out" | grep -q "$d" || { echo "skills CLI did not find $d"; exit 1; }
          done

  references:
    name: References match the fixtures
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Regenerate and compare
        run: python tests/_gen/build.py --check

  fixtures:
    # Pushes and PRs build the pinned lockfile. The weekly run (and a manual run) upgrades to the
    # newest releases first, because that is what a fresh scaffold installs.
    name: ${{ matrix.app }}${{ github.event_name != 'push' && github.event_name != 'pull_request' && ' (latest deps)' || '' }}
    runs-on: ubuntu-latest
    env:
      LATEST: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nexttest
            latest: next@latest eslint-config-next@latest react@latest react-dom@latest @gsap/react@latest gsap@latest lenis@latest ogl@latest
            check: npm run lint
            serve: npx next start -p 4400
          - app: astrotest
            latest: astro@latest @astrojs/sitemap@latest @astrojs/check@latest gsap@latest lenis@latest ogl@latest
            check: npx astro check
            serve: node ../../awwwards/scripts/serve.mjs dist --port 4400
    defaults:
      run:
        working-directory: tests/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true # a fresh scaffold may need a newer patch than the runner caches
          cache: npm
          cache-dependency-path: tests/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Upgrade to latest releases
        if: env.LATEST == 'true'
        run: npm install ${{ matrix.latest }}
      - name: Versions under test
        run: npm ls --depth=0
      - run: npm run build
      - run: ${{ matrix.check }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (loader, GL, transition, back, 404)
        run: |
          ${{ matrix.serve }} > server.log 2>&1 &
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:4400/ && break; sleep 1; done
          node ../smoke.mjs http://127.0.0.1:4400 || { cat server.log; exit 1; }

  report:
    # A red weekly run is easy to miss: open (or comment on) an issue so it shows up.
    name: Report weekly failure
    needs: fixtures
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fixtures fail against the latest releases"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The weekly build against @latest failed: $RUN. The references may no longer work on a fresh scaffold."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
